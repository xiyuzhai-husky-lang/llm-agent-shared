# Plan workflow mission ranks: `plan-workflow start --rank <rank>` holds a plan run to its rank's row.
# The columns mean what they mean in projects/common/orchestrator/mission-ranks.toml. `model` names a Codex model
# (gpt-6.1-sol, gpt-6-astra), which runs the roles with `codex exec`, or a Claude model (claude-fable-5-1,
# claude-opus-5-5), which runs them with Claude Code; Claude Code takes the efforts low through max.

